name: SonarCloud Analysis

on:
  push:
    branches: [ main, last-version, develop ]
  pull_request:
    branches: [ main, last-version ]
  workflow_dispatch: # Allow manual trigger

jobs:
  sonarcloud:
    name: SonarCloud Backend Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests and coverage
        run: npm run test:coverage
        continue-on-error: true

      - name: List coverage files (debug)
        run: |
          echo "Checking coverage directory..."
          ls -la coverage/ || echo "No coverage directory found"
          pwd

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./backend/