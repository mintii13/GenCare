# SonarQube project configuration
sonar.organization=thotp22
sonar.projectKey=gencare
sonar.projectName=GenCare
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarcloud.io

# Source code paths
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.spec.ts,**/coverage/**

# Language settings
sonar.sourceEncoding=UTF-8

# Coverage (optional, will work without it too)
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
